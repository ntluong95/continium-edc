{{- if and (.Values.secret) (.Values.secret.enabled) }}

{{- $postgresAdminPassword := include "continium.postgresAdminPassword" . }}
{{- $postgresUserPassword := include "continium.postgresUserPassword" . }}
{{- $redisPassword := include "continium.redisPassword" . }}
{{- $webappUrl := required "continium.webappUrl is required. Set it to your Continium instance URL (e.g., https://continium.example.com)" .Values.continium.webappUrl }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "continium.name" . }}-app-secrets
  labels:
    {{- include "continium.labels" . | nindent 4 }}
data:
  # Continium application URLs
  WEBAPP_URL: {{ $webappUrl | b64enc }}
  NEXTAUTH_URL: {{ $webappUrl | b64enc }}
  {{- if .Values.continium.publicUrl }}
  PUBLIC_URL: {{ .Values.continium.publicUrl | b64enc }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  REDIS_URL: {{ printf "redis://:%s@continium-redis-master:6379" $redisPassword | b64enc }}
  {{- else }}
  REDIS_URL: {{ .Values.redis.externalRedisUrl | b64enc }}
  {{- end }}
  {{- if .Values.postgresql.enabled }}
  DATABASE_URL: {{ printf "postgresql://continium:%s@continium-postgresql/continium" $postgresUserPassword | b64enc }}
  {{- else }}
  DATABASE_URL: {{ .Values.postgresql.externalDatabaseUrl | b64enc }}
  {{- end }}
  CRON_SECRET: {{ include "continium.cronSecret" . | b64enc }}
  ENCRYPTION_KEY: {{ include "continium.encryptionKey" . | b64enc }}
  NEXTAUTH_SECRET: {{ include "continium.nextAuthSecret" . | b64enc }}
  {{- if and (.Values.enterprise.licenseKey) (ne .Values.enterprise.licenseKey "") }}
  ENTERPRISE_LICENSE_KEY: {{ .Values.enterprise.licenseKey | b64enc }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  REDIS_PASSWORD: {{ $redisPassword | b64enc }}
  {{- end }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_ADMIN_PASSWORD: {{ $postgresAdminPassword | b64enc }}
  POSTGRES_USER_PASSWORD: {{ $postgresUserPassword | b64enc }}
  {{- end }}
{{- end }}
