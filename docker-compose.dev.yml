services:
  postgres:
    image: pgvector/pgvector:pg17
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - 5432:5432

  # REMOVE-IN-PUBLIC-REPO: license-postgres and license-server services are
  # extracted to the private continium-license-server repo (Phase 1).
  # This dev compose retains them for monorepo local development only.
  license-postgres:
    image: postgres:17-alpine
    volumes:
      - license-postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=continium_licenses
      - POSTGRES_USER=license
      - POSTGRES_PASSWORD=license
    ports:
      - "5434:5432"

  mailhog:
    image: arjenz/mailhog
    ports:
      - 8025:8025
      - 1025:1025

  valkey:
    image: valkey/valkey@sha256:12ba4f45a7c3e1d0f076acd616cb230834e75a77e8516dde382720af32832d6d
    command: "valkey-server"
    ports:
      - 6379:6379
    volumes:
      - valkey-data:/data

  rustfs-perms:
    image: busybox:1.36.1
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /data && chown -R 10001:10001 /data"]
    volumes:
      - rustfs-data:/data

  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.93
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    command: /data
    environment:
      - RUSTFS_ACCESS_KEY=devrustfs
      - RUSTFS_SECRET_KEY=devrustfs123
      - RUSTFS_ADDRESS=:9000
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_ADDRESS=:9001
    ports:
      - "9000:9000" # S3 API direct access
      - "9001:9001" # Web console
    volumes:
      - rustfs-data:/data

  rustfs-init:
    image: minio/mc@sha256:95b5f3f7969a5c5a9f3a700ba72d5c84172819e13385aaf916e237cf111ab868
    depends_on:
      - rustfs
    environment:
      - RUSTFS_ADMIN_USER=devrustfs
      - RUSTFS_ADMIN_PASSWORD=devrustfs123
      - RUSTFS_BUCKET_NAME=continium
      - RUSTFS_POLICY_NAME=continium-policy
      - RUSTFS_SERVICE_USER=devrustfs-service
      - RUSTFS_SERVICE_PASSWORD=devrustfs-service123
      - RUSTFS_CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002
    volumes:
      - ./docker/rustfs-init.sh:/usr/local/bin/rustfs-init.sh:ro
    entrypoint:
      - /bin/sh
      - /usr/local/bin/rustfs-init.sh

  worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    env_file:
      - .env
    depends_on:
      - postgres
      - valkey
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/continium?schema=public
      - JOBS_DATABASE_URL=postgresql://postgres:postgres@postgres:5432/continium?schema=public
      - REDIS_URL=redis://valkey:6379
      - WEBAPP_URL=http://host.docker.internal:3000
      - NODE_ENV=development

  license-server:
    build:
      context: .
      dockerfile: apps/license-server/Dockerfile
    ports:
      - "3100:3100"
    env_file:
      - .env
    depends_on:
      - license-postgres
      - valkey
    environment:
      - LICENSE_DATABASE_URL=postgresql://license:license@license-postgres:5432/continium_licenses?schema=public
      - REDIS_URL=redis://valkey:6379
      - TZ=UTC
      - PGTZ=UTC
      - NODE_ENV=development
      - CONTINIUM_LICENSE_ADMIN_TOKEN=dev-token-32chars-do-not-use-in-prod

volumes:
  postgres:
    driver: local
  license-postgres:
    driver: local
  valkey-data:
    driver: local
  rustfs-data:
    driver: local
