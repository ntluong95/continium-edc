name: SonarQube
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
permissions:
  contents: read
  pull-requests: read
jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Skip SonarQube when token is not configured
        if: env.SONAR_TOKEN == ''
        run: echo "SONAR_TOKEN is not configured; skipping SonarQube scan."

      - name: Harden the runner (Audit all outbound calls)
        if: env.SONAR_TOKEN != ''
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Setup Node.js 22.x
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x

      - name: Install pnpm
        if: env.SONAR_TOKEN != ''
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Install dependencies
        if: env.SONAR_TOKEN != ''
        run: pnpm install --no-frozen-lockfile --config.platform=linux --config.architecture=x64

      - name: create .env
        if: env.SONAR_TOKEN != ''
        run: |
          RANDOM_KEY=$(openssl rand -hex 32)
          {
            echo "NODE_ENV=test"
            echo "DATABASE_URL=postgresql://continium:continium@localhost:5432/continium"
            echo "DIRECT_URL=postgresql://continium:continium@localhost:5432/continium"
            echo "JOBS_DATABASE_URL=postgresql://continium:continium@localhost:5432/continium"
            echo "REDIS_URL=redis://localhost:6379"
            echo "ENCRYPTION_KEY=${RANDOM_KEY}"
            echo "CRON_SECRET=${RANDOM_KEY}"
            echo "NEXTAUTH_SECRET=${RANDOM_KEY}"
            echo "NEXTAUTH_URL=http://localhost:3000"
            echo "WEBAPP_URL=http://localhost:3000"
            echo "PUBLIC_URL=http://localhost:3000"
          } > .env

      - name: Run tests with coverage
        if: env.SONAR_TOKEN != ''
        run: |
          pnpm test:coverage
      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@2500896589ef8f7247069a56136f8dc177c27ccf
        with:
          args: >
            -Dsonar.verbose=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to get PR information, if any
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
