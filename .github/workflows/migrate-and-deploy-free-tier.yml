name: Migrate and Deploy Free Tier

# Required GitHub Secrets (Settings -> Secrets -> Actions):
#   VERCEL_TOKEN      - Vercel personal access token
#   VERCEL_ORG_ID     - team_R3XUO311oudUwaeX8fWTnHY3
#   VERCEL_PROJECT_ID - prj_SKY5qAqVC9YJRpaa45Lw6JjxxFgH
#   DIRECT_URL        - Supabase direct URL (postgres://...:5432/...) for migrations
#   DATABASE_URL      - Supabase pooler URL (postgres://...:6543/...) for runtime

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "20.18"
  PNPM_VERSION: "10.32.1"

jobs:
  migrate-edc:
    name: EDC Prisma migrate deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # continue-on-error lets deploy proceed even when DB secrets are not yet set
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile database package with turbo
        run: pnpm turbo run build --filter=@continium/database...

      - name: Run migrations
        run: pnpm --filter @continium/database db:migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATE_DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

  deploy-edc:
    name: EDC Vercel deploy
    needs: migrate-edc
    # always run - migration is best-effort; never block deploy on missing DB secrets
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project with Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to $URL"

      - name: Deployment summary
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
