name: Migrate & Deploy (Free-tier Vercel)

# Deploys the continium-edc app to Vercel Hobby.
# Runs DB migrations (Supabase EDC) before triggering the deploy so a
# failed migration aborts the release without restarting traffic on a
# broken schema. This workflow is designed to run in the extracted
# public continium-edc repo (Phase 1 of the free-tier deployment plan).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "20.18"
  PNPM_VERSION: "10.32.1"

jobs:
  migrate-edc:
    name: EDC — Prisma migrate:deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Supabase direct URL (pooler URL is not suitable for migrations)
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @continium/database generate

      - name: Run EDC migrations
        run: pnpm --filter @continium/database migrate:deploy
        env:
          # Prisma uses DIRECT_URL for migrate:deploy
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

  deploy-edc:
    name: EDC — Vercel deploy
    needs: migrate-edc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web
