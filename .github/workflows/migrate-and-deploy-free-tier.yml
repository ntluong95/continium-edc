name: Migrate and Deploy Free Tier

# Required GitHub Secrets (Settings -> Secrets -> Actions):
#   VERCEL_TOKEN      - Vercel personal access token
#   VERCEL_ORG_ID     - team_R3XUO311oudUwaeX8fWTnHY3
#   VERCEL_PROJECT_ID - prj_SKY5qAqVC9YJRpaa45Lw6JjxxFgH
#   DIRECT_URL        - Supabase direct URL (postgres://...:5432/...) for migrations
#   DATABASE_URL      - Supabase pooler URL (postgres://...:6543/...) for runtime
#   JOBS_DATABASE_URL - Supabase session pooler (postgres://...:5432/...) for jobs/queues

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.32.1"

jobs:
  migrate-edc:
    name: EDC Prisma migrate deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        # --no-frozen-lockfile so platform-specific optional binaries (e.g. rolldown)
        # are installed even when the lockfile was generated on a different OS.
        run: pnpm install --no-frozen-lockfile

      - name: Compile database package with turbo
        run: pnpm turbo run build --filter=@continium/database...

      - name: Run migrations
        run: pnpm --filter @continium/database db:migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATE_DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

  deploy-edc:
    name: EDC Vercel deploy
    needs: migrate-edc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Sync database env vars to Vercel
        run: |
          vercel env add DATABASE_URL production --force --yes --value "$DATABASE_URL" --token=${{ secrets.VERCEL_TOKEN }}
          vercel env add DIRECT_URL production --force --yes --value "$DIRECT_URL" --token=${{ secrets.VERCEL_TOKEN }}
          vercel env add JOBS_DATABASE_URL production --force --yes --value "$JOBS_DATABASE_URL" --token=${{ secrets.VERCEL_TOKEN }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          JOBS_DATABASE_URL: ${{ secrets.JOBS_DATABASE_URL }}

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Inject database env vars for build
        # Sensitive Vercel env vars are blank after pull; append CI secrets for local prebuild.
        run: |
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" >> .vercel/.env.production.local
          printf 'DIRECT_URL=%s\n' "$DIRECT_URL" >> .vercel/.env.production.local
          printf 'JOBS_DATABASE_URL=%s\n' "$JOBS_DATABASE_URL" >> .vercel/.env.production.local
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          JOBS_DATABASE_URL: ${{ secrets.JOBS_DATABASE_URL }}

      - name: Build project with Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to $URL"

      - name: Deployment summary
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
